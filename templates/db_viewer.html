<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homy Database Viewer</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        max-width: 1400px;
        margin: 0 auto;
        background: white;
        border-radius: 15px;
        padding: 30px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }

      .header {
        text-align: center;
        margin-bottom: 30px;
        padding-bottom: 20px;
        border-bottom: 2px solid #e0e0e0;
      }

      .header h1 {
        color: #333;
        font-size: 2.5rem;
        margin-bottom: 10px;
      }

      .header p {
        color: #666;
        font-size: 1.1rem;
      }

      .controls {
        display: flex;
        gap: 15px;
        margin-bottom: 30px;
        flex-wrap: wrap;
      }

      .btn {
        padding: 12px 25px;
        background: #667eea;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 1rem;
        font-weight: 500;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .btn:hover {
        background: #5a6fd8;
        transform: translateY(-2px);
      }

      .btn i {
        font-size: 1.1rem;
      }

      .btn-danger {
        background: #dc3545;
      }

      .btn-danger:hover {
        background: #c82333;
      }

      .btn-success {
        background: #28a745;
      }

      .btn-success:hover {
        background: #218838;
      }

      .table-container {
        overflow-x: auto;
        margin-bottom: 30px;
        border-radius: 10px;
        border: 1px solid #e0e0e0;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th {
        background: #667eea;
        color: white;
        padding: 15px;
        text-align: left;
        font-weight: 600;
        position: sticky;
        top: 0;
      }

      td {
        padding: 12px 15px;
        border-bottom: 1px solid #e0e0e0;
        color: #333;
      }

      tr:hover {
        background: #f8f9ff;
      }

      tr:last-child td {
        border-bottom: none;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
        margin-bottom: 30px;
      }

      .stat-card {
        background: #f8f9ff;
        padding: 20px;
        border-radius: 10px;
        text-align: center;
        border: 2px solid transparent;
        transition: all 0.3s ease;
      }

      .stat-card:hover {
        border-color: #667eea;
        transform: translateY(-3px);
      }

      .stat-card h3 {
        color: #667eea;
        margin-bottom: 10px;
        font-size: 1.2rem;
      }

      .stat-card .count {
        font-size: 2.5rem;
        font-weight: bold;
        color: #333;
      }

      .loading {
        text-align: center;
        padding: 40px;
        color: #666;
      }

      .loading i {
        font-size: 2rem;
        color: #667eea;
        margin-bottom: 15px;
      }

      .alert {
        padding: 15px;
        border-radius: 8px;
        margin: 15px 0;
        display: none;
      }

      .alert-success {
        background: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }

      .alert-error {
        background: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }

      .empty-state {
        text-align: center;
        padding: 50px;
        color: #666;
      }

      .empty-state i {
        font-size: 3rem;
        color: #ccc;
        margin-bottom: 15px;
      }

      .footer {
        text-align: center;
        margin-top: 30px;
        padding-top: 20px;
        border-top: 1px solid #e0e0e0;
        color: #666;
        font-size: 0.9rem;
      }

      @media (max-width: 768px) {
        .controls {
          flex-direction: column;
        }

        .btn {
          width: 100%;
          justify-content: center;
        }

        .stats {
          grid-template-columns: 1fr;
        }
      }
    </style>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1><i class="fas fa-database"></i> Homy Database Viewer</h1>
        <p>View and manage your database tables in real-time</p>
      </div>

      <div class="alert alert-success" id="successAlert"></div>
      <div class="alert alert-error" id="errorAlert"></div>

      <div class="stats" id="statsContainer">
        <!-- Stats will be loaded here -->
      </div>

      <div class="controls">
        <button class="btn" onclick="loadTable('users')">
          <i class="fas fa-users"></i> View Users
        </button>
        <button class="btn" onclick="loadTable('services')">
          <i class="fas fa-tools"></i> View Services
        </button>
        <button class="btn" onclick="loadTable('bookings')">
          <i class="fas fa-calendar-check"></i> View Bookings
        </button>
        <button class="btn btn-success" onclick="createSampleData()">
          <i class="fas fa-plus"></i> Create Sample Data
        </button>
        <button class="btn" onclick="refreshStats()">
          <i class="fas fa-sync-alt"></i> Refresh Stats
        </button>
        <button class="btn" onclick="exportToJSON()">
          <i class="fas fa-download"></i> Export to JSON
        </button>
      </div>

      <div id="tableContent">
        <div class="empty-state">
          <i class="fas fa-table"></i>
          <h3>No Table Selected</h3>
          <p>Click on one of the buttons above to view a table</p>
        </div>
      </div>

      <div class="footer">
        <p>
          Homy Database Viewer • Connected to Cassandra • Last updated:
          <span id="lastUpdated"></span>
        </p>
      </div>
    </div>

    <script>
      // Global variables
      let currentTable = null;
      let currentData = null;

      // Format date
      function formatDate(dateString) {
        if (!dateString) return "N/A";
        const date = new Date(dateString);
        return date.toLocaleString();
      }

      // Show alert
      function showAlert(type, message) {
        const alert = document.getElementById(type + "Alert");
        alert.textContent = message;
        alert.style.display = "block";
        setTimeout(() => {
          alert.style.display = "none";
        }, 5000);
      }

      // Load table statistics
      async function loadStats() {
        try {
          const response = await fetch("/api/db/stats");
          const data = await response.json();

          if (data.success) {
            const statsContainer = document.getElementById("statsContainer");
            statsContainer.innerHTML = "";

            Object.entries(data.stats).forEach(([table, count]) => {
              const statCard = document.createElement("div");
              statCard.className = "stat-card";
              statCard.innerHTML = `
                            <h3>${table.charAt(0).toUpperCase() + table.slice(1)}</h3>
                            <div class="count">${count}</div>
                            <p>records</p>
                        `;
              statsContainer.appendChild(statCard);
            });

            // Update last updated time
            document.getElementById("lastUpdated").textContent =
              new Date().toLocaleTimeString();
          }
        } catch (error) {
          console.error("Error loading stats:", error);
        }
      }

      // Load table data
      async function loadTable(tableName) {
        currentTable = tableName;

        // Show loading
        document.getElementById("tableContent").innerHTML = `
                <div class="loading">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Loading ${tableName} data...</p>
                </div>
            `;

        try {
          const response = await fetch(`/api/db/${tableName}`);
          const data = await response.json();

          if (data.success) {
            currentData = data.data;
            displayTable(data.data, tableName);
          } else {
            showAlert("error", `Error: ${data.message}`);
            document.getElementById("tableContent").innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-exclamation-triangle"></i>
                            <h3>Error Loading Data</h3>
                            <p>${data.message}</p>
                        </div>
                    `;
          }
        } catch (error) {
          showAlert("error", "Network error: " + error.message);
          document.getElementById("tableContent").innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle"></i>
                        <h3>Connection Error</h3>
                        <p>Unable to connect to server</p>
                    </div>
                `;
        }
      }

      // Display table data
      function displayTable(data, tableName) {
        if (!data || data.length === 0) {
          document.getElementById("tableContent").innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        <h3>No Data Found</h3>
                        <p>The ${tableName} table is empty</p>
                    </div>
                `;
          return;
        }

        // Get column names
        const columns = Object.keys(data[0]);

        // Create table HTML
        let html = `
                <div class="table-header">
                    <h2><i class="fas fa-table"></i> ${tableName.toUpperCase()} Table</h2>
                    <p>Showing ${data.length} records</p>
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
            `;

        // Add headers
        columns.forEach((column) => {
          html += `<th>${column.replace(/_/g, " ").toUpperCase()}</th>`;
        });

        html += `</tr></thead><tbody>`;

        // Add rows
        data.forEach((row) => {
          html += `<tr>`;
          columns.forEach((column) => {
            let value = row[column];

            // Format special values
            if (column.includes("date") || column.includes("time")) {
              value = formatDate(value);
            }

            // Truncate long values
            if (value && value.length > 100) {
              value = value.substring(0, 100) + "...";
            }

            html += `<td title="${value}">${value || '<span style="color:#999">NULL</span>'}</td>`;
          });
          html += `</tr>`;
        });

        html += `</tbody></table></div>`;

        document.getElementById("tableContent").innerHTML = html;
      }

      // Create sample data
      async function createSampleData() {
        if (!confirm("This will create sample users and bookings. Continue?")) {
          return;
        }

        try {
          const response = await fetch("/api/db/sample-data", {
            method: "POST",
          });

          const data = await response.json();

          if (data.success) {
            showAlert("success", "Sample data created successfully!");
            loadStats();
            if (currentTable) {
              loadTable(currentTable);
            }
          } else {
            showAlert("error", `Error: ${data.message}`);
          }
        } catch (error) {
          showAlert("error", "Network error: " + error.message);
        }
      }

      // Export to JSON
      function exportToJSON() {
        if (!currentData || !currentTable) {
          showAlert("error", "No data to export. Please load a table first.");
          return;
        }

        const jsonString = JSON.stringify(currentData, null, 2);
        const blob = new Blob([jsonString], { type: "application/json" });
        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = url;
        a.download = `${currentTable}_export_${new Date().toISOString().split("T")[0]}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        showAlert("success", `Data exported to ${a.download}`);
      }

      // Refresh stats
      function refreshStats() {
        loadStats();
        if (currentTable) {
          loadTable(currentTable);
        }
        showAlert("success", "Data refreshed");
      }

      // Initialize on page load
      document.addEventListener("DOMContentLoaded", function () {
        loadStats();
        document.getElementById("lastUpdated").textContent =
          new Date().toLocaleTimeString();

        // Auto-refresh every 30 seconds
        setInterval(loadStats, 30000);
      });
    </script>
  </body>
</html>
